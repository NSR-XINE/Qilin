name: Build Android APK

on:
  pull_request:
    branches:
      - main
      - master
      - staging
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release post'
        required: true
        type: boolean
        default: true
      tag_name:
        description: 'Release Tag (leave blank to auto-detect from app version, e.g. v6.8-beta)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qilin-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qilin-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ github.event.inputs.tag_name }}
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | awk -F '"' '{print $2}')
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi

          echo "Publishing release with tag: $TAG"

          printf "### Architecture Downloads:\n- **64-bit (arm64-v8a)**: Recommended for all modern Android devices\n- **32-bit (armeabi-v7a)**: For older 32-bit devices\n- **Universal**: Runs on all supported Android architectures\n" > release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating APK assets..."
            gh release upload "$TAG" app/build/outputs/apk/release/*.apk --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" app/build/outputs/apk/release/*.apk \
              --title "Qilin $TAG" \
              --notes-file release_notes.md \
              --generate-notes
          fi
