plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.mydonghua.app'
    compileSdk 37
    compileSdkMinor 2

    defaultConfig {
        applicationId "com.mydonghua.app"
        minSdk 29
        targetSdk 35
        versionCode 59
        versionName "6.8-beta"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += '**/libc++_shared.so'
        }
    }

    signingConfigs {
        debug {
            storeFile file("${project.rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll(
            "-Xskip-metadata-version-check",
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api"
        )
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'

    // Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    // Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.navigation:navigation-compose:2.10.2'

    // Room Database
    implementation "androidx.room:room-runtime:2.8.5"
    implementation "androidx.room:room-ktx:2.8.5"
    ksp "androidx.room:room-compiler:2.8.5"

    // Dagger Hilt
    implementation "com.google.dagger:hilt-android:2.60.1"
    ksp "com.google.dagger:hilt-compiler:2.60.1"
    implementation 'androidx.hilt:hilt-navigation-compose:1.4.0'

    // Coil Image Loader
    implementation "io.coil-kt:coil-compose:2.7.0"

    // Retrofit + Serialization
    implementation "com.squareup.retrofit2:retrofit:3.0.0"
    implementation "com.squareup.retrofit2:converter-kotlinx-serialization:3.0.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:5.5.1"

    // ExoPlayer Media3
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-ui:1.11.1"

    // Jetpack DataStore
    implementation 'androidx.datastore:datastore-preferences:1.3.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core-ktx:1.7.0'
    testImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation "androidx.room:room-testing:2.8.5"

    // Haze Backdrop Blur
    implementation 'dev.chrisbanes.haze:haze:1.7.3'
    implementation 'dev.chrisbanes.haze:haze-materials:1.7.3'

    // Gson
    implementation 'com.google.code.gson:gson:2.15.0'

    // youtubedl-android fresh download engine
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:aria2c:0.18.1'


}
